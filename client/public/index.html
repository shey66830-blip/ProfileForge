<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>ProfileForge AI</title>

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;

        background:
          radial-gradient(
            circle at top left,
            rgba(124, 58, 237, 0.18),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(6, 182, 212, 0.15),
            transparent 30%
          ),
          #09090f;

        color: #ffffff;

        min-height: 100vh;

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }

      .card {
        background: rgba(16, 16, 24, 0.88);

        backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 24px;

        padding: 24px;

        margin-bottom: 24px;

        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      button {
        border: none;
        outline: none;
        cursor: pointer;

        transition: all 0.2s ease;

        font-family: inherit;
      }

      button:hover {
        transform: translateY(-1px);
      }

      input,
      textarea,
      select {
        width: 100%;

        padding: 14px 16px;

        margin-top: 12px;

        background: rgba(255, 255, 255, 0.04);

        border: 1px solid rgba(255, 255, 255, 0.08);

        color: white;

        border-radius: 14px;

        font-size: 15px;

        font-family: inherit;

        outline: none;

        transition: 0.2s ease;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(124, 58, 237, 0.8);

        box-shadow:
          0 0 0 4px rgba(124, 58, 237, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 130px;
      }

      ::placeholder {
        color: rgba(255, 255, 255, 0.42);
      }

      ::selection {
        background: rgba(124, 58, 237, 0.4);
      }

      .hero-left h1 {
        font-family: "Space Grotesk", sans-serif;

        font-size: clamp(44px, 6vw, 78px);

        line-height: 0.95;

        letter-spacing: -3px;

        margin: 12px 0 18px;

        font-weight: 700;

        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #d8b4fe 45%,
          #60a5fa 100%
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @media (max-width: 768px) {
        .container {
          padding: 18px;
        }

        .card {
          padding: 18px;
          border-radius: 18px;
        }

        .hero-left h1 {
          font-size: 48px;
          letter-spacing: -2px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
