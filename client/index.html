<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: "Nunito Sans", "DM Sans", system-ui, sans-serif;
        background: linear-gradient(180deg, #0b1120, #0e1626);
        color: white;
      }

      .container {
        max-width: 950px;
        margin: auto;
        padding: 30px 20px;
      }

      .card {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 28px;
        margin-bottom: 24px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 36px;
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }

      h2 {
        margin-bottom: 18px;
      }

      p {
        color: #b7b7c9;
      }

      input,
      textarea {
        width: 100%;
        margin-top: 12px;
        padding: 14px;
        background: #0f172a;
        border: 1px solid #26334a;
        color: white;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #0d9488;
      }

      button {
        background: #0d9488;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        margin-top: 16px;
      }

      button:hover {
        background: #0f766e;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .badge {
        display: inline-block;
        background: #16283a;
        padding: 7px 12px;
        border-radius: 6px;
        margin: 5px;
        color: #99f6e4;
      }

      .error {
        color: #ff6b6b;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
