<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume AI</title>

    <style>
      body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #09090f, #151528);
  color: white;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 30px 20px;
}

.card {
  background: rgba(17, 17, 24, 0.95);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

h2 {
  margin-bottom: 18px;
}

p {
  color: #b7b7c9;
}

input, textarea {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: #0f0f18;
  border: 1px solid #2e2e3d;
  color: white;
  border-radius: 10px;
  font-size: 15px;
}

input:focus, textarea:focus {
  outline: none;
  border-color: #7c6fef;
}

button {
  background: linear-gradient(135deg, #7c6fef, #9f7aea);
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 16px;
}

button:hover {
  transform: translateY(-2px);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.badge {
  display: inline-block;
  background: #222236;
  padding: 7px 12px;
  border-radius: 999px;
  margin: 5px;
  color: #cfcfff;
}

.error {
  color: #ff6b6b;
  margin-top: 10px;
}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
